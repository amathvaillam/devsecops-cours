name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Node 20 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tpuser
          POSTGRES_PASSWORD: tppassword
          POSTGRES_DB: tpdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpuser -d tpdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Initialiser le schéma de la base
        run: sudo apt-get update && sudo apt-get install -y postgresql-client && PGPASSWORD=tppassword psql -h localhost -U tpuser -d tpdb -f db/init.sql
      - name: Installer les dépendances
        run: npm ci
        working-directory: app
      - name: Lancer les tests
        run: npm test
        working-directory: app
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: tpdb
          DB_USER: tpuser
          DB_PASSWORD: tppassword

  build:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t tp-crud:ci ./app
